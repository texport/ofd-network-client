name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate SPM manifest and XCFramework archive
        run: ./gradlew generateSpmManifest

      - name: Verify generated Package.swift is committed
        run: git diff --exit-code Package.swift

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Kotlin Multiplatform TCP client for OFD CPCR communication.

            ## Highlights
            - Adds official Android target support.
            - Adds 5 MiB default response limit.
            - Adds detailed machine-readable error classification.
            - Maintains 100% Kover verification for covered production code.
          files: build/XCFrameworks/release/OfdNetworkClient.xcframework.zip
